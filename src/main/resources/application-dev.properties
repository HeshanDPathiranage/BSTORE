# Development profile with H2 (fast local runs)
spring.datasource.url=jdbc:h2:~/bstore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create schema for dev
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# optional: different server port for dev
# server.port=8080
