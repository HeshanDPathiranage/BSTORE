# Server Port
server.port=8080

# Active profile: use 'dev' (H2) by default, or override with --spring.profiles.active=mysql or --spring.profiles.active=postgres
#spring.profiles.active=dev

# Note: MySQL configuration moved to application-mysql.properties
# PostgreSQL configuration defined in application-postgres.properties
# For MySQL, run with: --spring.profiles.active=mysql
# For PostgreSQL, run with: --spring.profiles.active=postgres
# For H2 (default), no additional args needed or use: --spring.profiles.active=dev
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=postgres

# Admin Credentials Configuration
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}
